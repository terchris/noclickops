# Lovable Vite SPA + PWA, served by nginx.
# Rendered by `noclickops sync-lovable` (PLAN-006) — DO NOT edit per-service;
# changes here propagate via `noclickops update` then `noclickops sync-lovable`.
# Port 3000 matches the platform's SERVICE_PORT / SERVICE_HEALTH_PROBE_PORT.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # If nginx ever issues a redirect, keep the Location header relative —
    # never leak the internal Container Apps hostname behind Front Door.
    absolute_redirect off;

    # gzip text-ish content
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # /health — exact match, evaluated before the SPA fallback.
    # Body is served straight from health.json, which sync-lovable regenerates
    # on every run with the upstream repo URL, commit SHA, and commit date.
    location = /health {
        default_type application/json;
        alias /usr/share/nginx/html/health.json;
    }

    # PWA freshness — never cache the service worker or the manifest.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed build assets — cacheable forever.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA deep-link fallback: anything not matched above falls through to index.html.
    # We deliberately do NOT include $uri/ here — a SPA route like /parties that
    # happens to match a directory in dist/ (e.g. Lovable's public/parties/ asset
    # folder) would otherwise trigger nginx's auto-trailing-slash 301 redirect
    # instead of falling through to the SPA. Real assets inside such a directory
    # (/parties/ap.svg) still resolve via $uri.
    location / {
        try_files $uri /index.html;
    }
}
